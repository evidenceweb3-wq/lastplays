const api=async(p,o={})=>{if(!sb)bad('database_not_configured',503);
 const u=new URL(p,'http://x'),q=u.searchParams,path=u.pathname,m=o.method||'GET',
   now=new Date().toISOString(),lim=Math.min(Math.max(+q.get('limit')||50,1),100);
 if(path==='/status'){const rows=ck(await sb.from('ingestion_state').select('source,last_run_at,last_status,last_error'));
   return{database:true,pumpfun:rows.some(r=>r.source.startsWith('pumpfun')&&r.last_status==='ok'),

 if(path==='/feed'){let s=sb.from('trades').select('signature,side,sol_amount,wallet,block_time,source,tokens(mint,name,symbol,market_cap_usd)').order('block_time',{ascending:false}).limit(lim);
   if(['buy','sell'].includes(q.get('side')))s=s.eq('side',q.get('side'));
   if(+q.get('minSol'))s=s.gte('sol_amount',+q.get('minSol'));
   return{events:ck(await s),fetchedAt:now}}
 if(path==='/callers'){const per=['24h','7d','30d','all'].includes(q.get('period'))?q.get('period'):'24h',
     col={avg:'avg_return_pct',best:'best_call_pct',calls:'total_calls',median:'median_return_pct'}[q.get('sort')]||'avg_return_pct';
   return{period:per,callers:ck(await sb.from('caller_performance').select('*').eq('period',per).order(col,{ascending:false,nullsFirst:false}).limit(lim)),fetchedAt:now}}
 if(path==='/wallets'){const per=PER.includes(q.get('period'))?q.get('period'):'24h',
     col={realized:'realized_pnl',combined:'combined_pnl',positions:'positions'}[q.get('sort')]||'combined_pnl';
   return{period:per,wallets:ck(await sb.from('wallet_performance').select('*').eq('period',per).order(col,{ascending:false,nullsFirst:false}).limit(lim)),fetchedAt:now}}
 if(path.startsWith('/wallet/')){const a=path.slice(8);if(!B58.test(a))bad('invalid_address');
   const[perf,trades]=await Promise.all([
     sb.from('wallet_performance').select('*').eq('wallet',a),

   return{address:a,performance:ck(perf),trades:ck(trades),portfolio:pf,portfolioAvailable:!!pf}}
 if(path.startsWith('/token/')){const mt=path.slice(7);if(!B58.test(mt))bad('invalid_mint');
   const[t,tr,c]=await Promise.all([
     sb.from('tokens').select('*').eq('mint',mt).maybeSingle(),

   ]);
   if(!ck(t))bad('token_not_found',404);
   const w={};ck(tr).forEach(x=>w[x.wallet]=(w[x.wallet]||0)+Number(x.sol_amount));
   return{token:t.data,trades:tr.data,callouts:ck(c),
     topWallets:Object.entries(w).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([wallet,sol_volume])=>({wallet,sol_volume}))}}
 if(path.startsWith('/watchlist')){if(!session)bad('unauthorized',401);

 if(path==='/topcalls')return ck(await sb.from('public_callouts').select('id,caller,called_at,entry_market_cap_usd,max_upside_pct,hit_2x,hit_5x,hit_10x,tokens(mint,symbol,name)').neq('status','incomplete').not('max_upside_pct','is',null).order('max_upside_pct',{ascending:false}).limit(20));

 bad('not_found',404)};

/* ── SMART WALLET DETECTION ── */
async function getSmartWallets(){
  if(smartWalletsCache!==null)return smartWalletsCache;
  try{
    const {data}=await sb.from('wallet_performance')
      .select('wallet,combined_pnl')
      .gt('combined_pnl',0)
      .order('combined_pnl',{ascending:false})
      .limit(100);
    smartWalletsCache=new Set((data||[]).map(r=>r.wallet));
  }catch{smartWalletsCache=new Set()}
  return smartWalletsCache;
}

/* ── SIGNAL SCORING ── */
async function computeSignals(){
  const smart=await getSmartWallets();
  const cutoff=new Date(Date.now()-6*3600*1000).toISOString();

  // Fetch up to 1000 recent trades — this is the ONLY heavy query

    .select('mint,wallet,side,sol_amount,block_time,tokens(mint,symbol,name,market_cap_usd)')
    .gte('block_time',cutoff)
    .order('block_time',{ascending:false})
    .limit(1000);
  if(error)throw error;

  const now=Date.now();
  const tokens=new Map();

  for(const t of trades||[]){
    if(!t.mint)continue;
    const sol=Number(t.sol_amount);
    const bt=new Date(t.block_time).getTime();
    const ageSec=(now-bt)/1000;

    if(!tokens.has(t.mint)){
      tokens.set(t.mint,{
        mint:t.mint,
        symbol:t.tokens?.symbol||t.tokens?.name||t.mint.slice(0,6),
        name:t.tokens?.name,
        mcap:t.tokens?.market_cap_usd,
        buys:0,sells:0,buy_sol:0,sell_sol:0,total_sol:0,
        vol_5m:0,vol_1h:0,
        wallets:new Set(),
        smart_buys:0,smart_sell:0,smart_buy_sol:0,
        first_seen:bt,last_trade:bt,
      });
    }
    const tk=tokens.get(t.mint);
    tk.total_sol+=sol;
    tk.wallets.add(t.wallet);
    if(bt<tk.first_seen)tk.first_seen=bt;
    if(bt>tk.last_trade)tk.last_trade=bt;
    if(ageSec<300)tk.vol_5m+=sol;
    if(ageSec<3600)tk.vol_1h+=sol;

    if(t.side==='buy'){
      tk.buys++;tk.buy_sol+=sol;
      if(smart.has(t.wallet)){tk.smart_buys++;tk.smart_buy_sol+=sol}
    }else{
      tk.sells++;tk.sell_sol+=sol;
      if(smart.has(t.wallet))tk.smart_sell++;
    }
  }

  const ranked=[...tokens.values()].map(tk=>{
    const buy_ratio=tk.buys/Math.max(tk.buys+tk.sells,1);
    const net_sol=tk.buy_sol-tk.sell_sol;
    const age_hrs=(now-tk.first_seen)/3600000;
    const fresh=age_hrs<0.5?3:age_hrs<2?2:age_hrs<6?1.5:1;

    let score=0;
    score+=Math.log10(tk.total_sol+1)*15;
    score+=buy_ratio*25;
    score+=Math.min(tk.wallets.size,30);
    score+=tk.smart_buys*25;
    score+=Math.log10(tk.vol_5m+1)*10;
    score*=fresh;

    return{...tk,buy_ratio,net_sol,age_hrs,fresh,score,
      wallets_count:tk.wallets.size,
      smart_net:tk.smart_buys-tk.smart_sell};
  }).filter(tk=>tk.total_sol>=0.5)
    .sort((a,b)=>b.score-a.score);

  return{ranked,smartCount:smart.size,totalTokens:tokens.size};
}

async function status(){
  try{
    const s=await api('/status');lastStatus=s;
    const stale=t=>{if(!t)return'missing';const m=(Date.now()-new Date(t))/60000;if(m<3)return'ok';if(m<15)return'stale';return'old'};
    const h=s.ingestion.find(r=>r.source==='helius');
    const pf=s.ingestion.find(r=>r.source==='pumpfun');
    const hS=h?stale(h.last_run_at):'missing';
    const pfS=pf?stale(pf.last_run_at):'missing';
    const cls=(st,stt)=>{if(stt==='error')return'bad';if(st==='ok')return'ok';if(st==='stale')return'warn';return'bad'};
    const sfx=st=>st==='stale'?' ·STALE':st==='old'?' ·OLD':st==='missing'?' ·—':'';
    $('#conn').innerHTML=[
      `<span class="pill ok">DB LIVE</span>`,
      `<span class="pill ${cls(pfS,pf?.last_status)}">PUMP${sfx(pfS)}</span>`,
      `<span class="pill ${cls(hS,h?.last_status)}">HELIUS${sfx(hS)}</span>`
    ].join('');
    return s;
  }catch{lastStatus=null;$('#conn').innerHTML='<span class="pill bad">OFFLINE</span>'}
}

      note='First 10 buyers per token, timed from first ingested trade.';}
    else{const d=await api('/active?days='+days[period]);
      html=tbl(['#','WALLET','TRADES','SOL VOLUME'],d.map((x,i)=>`<tr>
        <td>${i+1}</td><td>${W(x.wallet)}</td><td>${x.trades}</td><td>${n(x.sol_volume)}</td>
      </tr>`));
      note='Calculated from ingested trades.';}
    $('#bar').innerHTML=tabs.map(([m,l])=>`<button data-m="${m}" class="${m===mode?'on':''}">${l}</button>`).join('')+' | '
      +(['positions','early'].includes(mode)?'':['24h','7d','30d'].map(p=>`<button data-p="${p}" class="${p===period?'on':''}">${p.toUpperCase()}</button>`).join(''))
      +(mode==='pnl'?`<select id="so"><option value="combined">COMBINED PNL</option><option value="realized">REALIZED PNL</option><option value="positions">POSITIONS</option></select>`:'');
    if(mode==='pnl'&&$('#so'))$('#so').value=sort;
    $('#bar').querySelectorAll('button').forEach(b=>b.onclick=()=>{if(b.dataset.m)mode=b.dataset.m;else period=b.dataset.p;draw()});
    if($('#so'))$('#so').onchange=e=>{sort=e.target.value;draw()};
    $('#list').innerHTML=html;
    $('#fr').innerHTML=`<div class="note" style="margin-top:12px">${note}</div>`+fresh(new Date().toISOString());
  };
  $('#app').innerHTML=`
    <h2>WALLETS</h2>
    <p class="sub">Verified API data and calculated metrics labeled.</p>
    <div class="bar" id="bar"></div>
    <div class="box" id="list"></div>
    <div id="fr"></div>`;
  await draw();
},

async wallet(a){
  const d=await api('/wallet/'+a);
  let fallback=[];
  if(!d.portfolioAvailable){
    const acc={};
    for(const t of d.trades){
      const k=t.tokens?.mint;if(!k)continue;
      if(!acc[k])acc[k]={mint:k,symbol:t.tokens?.symbol??null,name:t.tokens?.name??null,bought:0,sold:0,trades:0};
      if(t.side==='buy')acc[k].bought+=Number(t.sol_amount);else acc[k].sold+=Number(t.sol_amount);
      acc[k].trades++;
    }
    fallback=Object.values(acc).map(p=>({...p,net_sol:+(p.bought-p.sold).toFixed(6)})).filter(p=>p.net_sol>0).sort((a,b)=>b.net_sol-a.net_sol);
  }
  const port=d.portfolioAvailable?(d.portfolio?.data||[]):fallback;
  const label=d.portfolioAvailable?'Portfolio · full history from Edge Function':'Portfolio · last 50 trades';
  $('#app').innerHTML=`
    <h2>WALLET ${short(a)}</h2>
    <p class="sub mono">${esc(a)} ${star('wallet',a)}</p>
    <div class="grid">
      ${['24h','7d','30d'].map(p=>{
        const x=d.performance.find(r=>r.period===p);
        return `<div class="k"><small>${p.toUpperCase()} PNL</small>
          <div class="${x?pnlClass(x.combined_pnl):''}">${x?n(x.combined_pnl):'n/a'}</div>
          <small class="delta">R ${x?n(x.realized_pnl):'n/a'} · U ${x?n(x.unrealized_pnl):'n/a'}</small></div>`;
      }).join('')}
    </div>
    ${port.length?`<div class="note">${label}</div><div class="box">${portTable(port)}</div><br>`:'<div class="note">No open positions.</div>'}
    <div class="box">${d.trades.length?`<table>
      <tr><th>TIME</th><th>TOKEN</th><th>SIDE</th><th>SOL</th></tr>
      ${d.trades.map(t=>`<tr>
        <td>${ago(t.block_time)}</td>
        <td>${tokLink(t.tokens)} ${whaleBadge(t.sol_amount)}</td>
        <td class="${t.side}">${t.side.toUpperCase()}</td>
        <td>${n(t.sol_amount)}</td>
      </tr>`).join('')}
    </table>`:empty('No trades recorded.',{icon:'📭',title:'NO TRADES'})}</div>`;
},

async token(m){
  if(!m){
    $('#app').innerHTML=`<h2>TOKEN INTEL</h2>
      <p class="sub">Open any token from the feed, or paste a CA.</p>
      <div class="bar"><input id="ca" placeholder="Token contract address" style="width:420px"><button class="pri" onclick="location.hash='token/'+$('#ca').value.trim()">OPEN</button></div>`;
    return;
  }
  const d=await api('/token/'+m),t=d.token;
  const smart=await getSmartWallets();
  const trades=d.trades;

  // Compute token-specific signals
  const now=Date.now();
  let vol_5m=0,vol_1h=0,vol_total=0,buy_sol=0,sell_sol=0;
  let smart_buys=0,smart_sell=0;
  const buyers=new Map();
  let first_seen=null;
  for(const x of trades){
    const sol=Number(x.sol_amount);
    const bt=new Date(x.block_time).getTime();
    const age=(now-bt)/1000;
    vol_total+=sol;
    if(age<300)vol_5m+=sol;
    if(age<3600)vol_1h+=sol;
    if(x.side==='buy'){buy_sol+=sol;buyers.set(x.wallet,(buyers.get(x.wallet)||0)+1);if(smart.has(x.wallet))smart_buys++}
    else{sell_sol+=sol;if(smart.has(x.wallet))smart_sell++}
    if(!first_seen||bt<first_seen)first_seen=bt;
  }
  const buys=trades.filter(x=>x.side==='buy').length;
  const sells=trades.filter(x=>x.side==='sell').length;
  const buy_ratio=buys/Math.max(buys+sells,1);
  const age_hrs=(now-first_seen)/3600000;

  const topBuyers=[...buyers.entries()].sort((a,b)=>b[1]-a[1]).slice(0,8);

  $('#app').innerHTML=`
    <h2>${esc(t.name||'Unknown')} <span style="color:var(--green)">${esc(t.symbol||'')}</span></h2>
    <p class="sub mono">${esc(t.mint)} ${caBtn(t.mint)} ${star('token',t.mint)}</p>

    <div class="grid">
      ${[['MARKET CAP',t.market_cap_usd],['PRICE',t.price_usd],['VOLUME 24H',t.volume_24h_usd],['LIQUIDITY',t.liquidity_usd]].map(([a,b])=>
        `<div class="k"><small>${a}</small><div>${b!=null?'$'+n(b,6):'n/a'}</div></div>`).join('')}
    </div>

    <h2>MOMENTUM</h2>
    <div class="bar health">
      <div class="stat"><span class="lbl">AGE</span><span class="val">${age_hrs<1?Math.round(age_hrs*60)+'m':Math.round(age_hrs)+'h'}</span></div>
      <div class="stat"><span class="lbl">VOL 5M</span><span class="val">${n(vol_5m,1)} SOL</span></div>
      <div class="stat"><span class="lbl">VOL 1H</span><span class="val">${n(vol_1h,1)} SOL</span></div>
      <div class="stat"><span class="lbl">VOL TOTAL</span><span class="val">${n(vol_total,1)} SOL</span></div>
      <div class="stat"><span class="lbl">BUY PRESSURE</span><span class="val ${buy_ratio>0.6?'buy':buy_ratio<0.4?'sell':''}">${Math.round(buy_ratio*100)}%</span></div>
      <div class="stat"><span class="lbl">NET FLOW</span><span class="val ${buy_sol-sell_sol>0?'buy':'sell'}">${(buy_sol-sell_sol>0?'+':'')+n(buy_sol-sell_sol,2)}</span></div>
    </div>

    ${smart_buys>0?`<div class="banner purple"><div><b>◆ SMART MONEY IN</b><div class="msg">${smart_buys} known profitable wallet${smart_buys>1?'s':''} bought this token.</div></div></div>`:''}

    <h2>TOP BUYERS</h2>
    <div class="box">${topBuyers.length?`<table>
      <tr><th>WALLET</th><th>BUYS</th><th></th></tr>
      ${topBuyers.map(([w,c])=>`<tr>
        <td><a class="l" href="#wallet/${esc(w)}">${short(w)}</a> ${smart.has(w)?'<span class="badge smart">SMART</span>':''}</td>
        <td>${c}×</td>
        <td>${star('wallet',w)}</td>
      </tr>`).join('')}
    </table>`:empty('No buyers yet.',{icon:'👛'})}</div>

    <h2 style="margin-top:20px">PUBLIC CALLS</h2>
    <div class="box">${d.callouts.length?`<table>
      <tr><th>CALLER</th><th>WHEN</th><th>STATUS</th><th>MAX UPSIDE</th></tr>
      ${d.callouts.map(c=>`<tr>
        <td><a class="l" href="#caller/${esc(c.caller)}">${short(c.caller)}</a></td>
        <td><a class="l" href="#callout/${c.id}">${c.called_at?ago(c.called_at)+' ago':'unverified'}</a></td>
        <td>${c.status}</td>
        <td class="buy">${pct(c.max_upside_pct)}</td>
      </tr>`).join('')}
    </table>`:empty('No public calls recorded.',{icon:'📞',title:'NO CALLS'})}</div>

    <h2 style="margin-top:20px">RECENT TRADES</h2>
    <div class="box">${trades.length?`<table>
      <tr><th>TIME</th><th>SIDE</th><th>SOL</th><th>WALLET</th></tr>
      ${trades.slice(0,50).map(x=>`<tr>
        <td>${ago(x.block_time)}</td>
        <td class="${x.side}">${x.side.toUpperCase()}</td>
        <td>${n(x.sol_amount)} ${whaleBadge(x.sol_amount)}</td>
        <td><a class="l" href="#wallet/${esc(x.wallet)}">${short(x.wallet)}</a> ${smart.has(x.wallet)?'<span class="badge smart">S</span>':''}</td>
      </tr>`).join('')}
    </table>`:empty('No trades recorded.',{icon:'📭'})}</div>`;
},

async callout(id){
  const c=await api('/callout/'+id);
  const s=Object.fromEntries((c.call_snapshots||[]).map(x=>[x.interval_label,x]));
  $('#app').innerHTML=`
    <h2>CALL · ${esc(c.tokens?.symbol||short(c.mint))}</h2>
    <p class="sub mono">caller ${esc(c.caller)} · ${c.called_at?ago(c.called_at)+' ago':'unverified'} ${star('callout',c.id)}</p>
    ${c.status==='incomplete'?'<div class="banner"><div><b>INCOMPLETE</b><div class="msg">Call time or entry price could not be verified.</div></div></div>':''}
    <div class="grid">
      ${[['ENTRY MCAP',c.entry_market_cap_usd!=null?'$'+n(c.entry_market_cap_usd,0):'n/a',''],
        ['MAX UPSIDE',pct(c.max_upside_pct),'buy'],
        ['MAX DRAWDOWN',pct(c.max_drawdown_pct),'sell'],
        ['2X / 5X / 10X',[c.hit_2x,c.hit_5x,c.hit_10x].map(b=>b?'✔':'–').join(' '),'']]
        .map(([a,b,cls])=>`<div class="k"><small>${a}</small><div class="${cls}">${b}</div></div>`).join('')}
    </div>
    <div class="box"><table>
      <tr><th>INTERVAL</th><th>MCAP</th><th>RETURN</th></tr>
      ${['5m','15m','1h','6h','24h','7d'].map(i=>`<tr>
        <td>${i}</td>
        <td>${s[i]?'$'+n(s[i].market_cap_usd,0):'<span style="color:var(--muted)">not captured</span>'}</td>
        <td class="${s[i]?pnlClass(s[i].return_pct):''}">${s[i]?pct(s[i].return_pct):'n/a'}</td>
      </tr>`).join('')}
    </table></div>
    <p class="fresh">Token <a class="l" href="#token/${esc(c.mint)}">${short(c.mint)}</a></p>`;
},

async watchlist(){
  if(!session){
    $('#app').innerHTML=`<h2>WATCHLIST</h2>`+empty('Connect Phantom in PROFILE to follow wallets, callers and tokens.',{icon:'⭐',title:'NOT CONNECTED',hint:'Open <code>#profile</code> and connect Phantom.'});
    return;
  }
  const w=await api('/watchlist');
  $('#app').innerHTML=`
    <h2>WATCHLIST</h2>
    <p class="sub">Your followed wallets, callers, and tokens.</p>
    <div class="box">${w.length?`<table>
      <tr><th>TYPE</th><th>REF</th><th></th></tr>
      ${w.map(x=>`<tr>
        <td><span class="fresh-tag">${x.kind}</span></td>
        <td><a class="l" href="#${x.kind==='callout'?'feed':x.kind}/${esc(x.ref)}">${esc(short(x.ref))}</a></td>
        <td><button onclick="api('/watchlist/${x.id}',{method:'DELETE'}).then(()=>{toast('Removed');route()})">REMOVE</button></td>
      </tr>`).join('')}
    </table>`:empty('Nothing followed yet. Use ☆ anywhere.',{icon:'⭐',title:'EMPTY',hint:'Click the star next to any wallet, caller, or token.'})}</div>
    <h2 style="margin-top:24px">NOTIFICATIONS</h2>
    <div class="box" id="nt">${empty('No notifications.',{icon:'🔔',title:'QUIET'})}</div>`;
  if(sb){
    const {data}=await sb.from('notifications').select('*').eq('user_id',session.user.id).order('created_at',{ascending:false}).limit(30);
    if(data?.length)$('#nt').innerHTML=`<table>${data.map(x=>`<tr>
      <td>${ago(x.created_at)}</td><td>${esc(x.title)}</td><td>${esc(x.body||'')}</td>
    </tr>`).join('')}</table>`;
    chan=sb.channel('rt-notif').on('postgres_changes',{event:'INSERT',schema:'public',table:'notifications',filter:'user_id=eq.'+session.user.id},()=>route()).subscribe();
  }
},

async profile(){
  if(!sb){$('#app').innerHTML=`<h2>PROFILE</h2>`+empty('Supabase is not configured.',{icon:'⚙️'});return}
  if(session){
    $('#app').innerHTML=`
      <h2>PROFILE</h2>
      <p class="sub">Native Phantom session — no Supabase auth, no signature.</p>
      <div class="grid">
        <div class="k"><small>WALLET ADDRESS</small><div class="mono" style="font-size:11px;word-break:break-all">${esc(session.user.id)}</div></div>
      </div>
      <div class="bar">
        <button id="cp">COPY WALLET</button>
        <button onclick="disconnectWallet()">DISCONNECT</button>
        <a href="#watchlist"><button>OPEN WATCHLIST</button></a>
      </div>`;
    $('#cp').onclick=function(){copy(session.user.id);this.textContent='COPIED';toast('Wallet copied');setTimeout(()=>this.textContent='COPY WALLET',1200)};
  } else {
    $('#app').innerHTML=`
      <h2>PROFILE</h2>
      <div style="text-align:center;padding:60px 20px">
        <div style="font-size:64px;margin-bottom:20px;filter:drop-shadow(0 0 20px rgba(153,69,255,.4))">👻</div>
        <h2 style="justify-content:center;display:flex">CONNECT PHANTOM</h2>
        <p class="sub" style="max-width:480px;margin:10px auto 24px">Sign in with your Solana wallet — no password, no email.</p>
        <button class="pri" id="go" style="padding:12px 28px;font-size:13px;letter-spacing:.1em">CONNECT WALLET →</button>
        <p class="fresh" id="er"></p>
      </div>`;
    $('#go').onclick=async()=>{
      const p=window.phantom?.solana||window.solana;
      if(!p?.isPhantom){window.open('https://phantom.app/','_blank');return}
      try{
        $('#er').textContent='Approve the connection in Phantom…';
        const resp=await p.connect();
        const wallet=resp.publicKey.toString();
        if(!B58.test(wallet))throw new Error('Invalid wallet address returned');
        setWallet(wallet);toast('Wallet connected');
      }catch(e){$('#er').textContent=e.message||'Connection failed'}
    };
  }
}
};

async function route(){
  cleanup();
  const [k,...r]=(location.hash.slice(1)||'alpha').split('/');
  const arg=decodeURIComponent(r.join('/'));
  const nav=k==='caller'||k==='callout'?'callers':k==='wallet'?'wallets':k;
  $('#nav').innerHTML=ROUTES.map(([h,l])=>`<a href="#${h}" class="${h===nav?'on':''} ${h==='alpha'?'alpha':''}">${l}</a>`).join('');
  try{await (V[k]||V.alpha)(arg)}
  catch(e){
    $('#app').innerHTML=`<div class="box">${empty(e.status===503?'Database not configured.':e.status===404?'Not found.':'Request failed: '+esc(e.message),{icon:'⚠️',title:'ERROR'})}</div>`;
  }
}

(async()=>{
  cfg=window.CFG||{};
  if(cfg.supabaseUrl&&cfg.supabaseAnonKey){
    sb=supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey);
    const saved=localStorage.getItem('lp_wallet');
    if(saved&&B58.test(saved))session={user:{id:saved,wallet:saved}};
  }
  status();
  setInterval(status,60000);
  addEventListener('hashchange',route);
  route();
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden){clearInterval(timer)}
    else if(!timer){timer=setInterval(()=>{},30000)}
  });
})();
</script></body></html>
