<style>

header{

}

main{position:relative;z-index:1;padding:24px;max-width:1400px;margin:auto}
h2{margin:0 0 6px;font-size:15px;font-weight:700;letter-spacing:.12em;color:var(--text)}

table{width:100%;border-collapse:collapse}
th{

td{padding:10px 14px;border-bottom:1px solid rgba(24,32,48,.6);font-size:12px;white-space:nowrap;color:var(--text)}
tr:hover td{background:rgba(157,255,87,.02)}
tr:last-child td{border-bottom:none}

.buy{color:var(--buy);font-weight:600;text-shadow:0 0 8px rgba(20,241,149,.3)}
.sell{color:var(--sell);font-weight:600;text-shadow:0 0 8px rgba(255,84,112,.3)}
a.l{color:var(--green);text-decoration:none;cursor:pointer;transition:opacity .15s}
a.l:hover{opacity:.75;text-shadow:0 0 8px var(--green)}

.fresh-tag{
  display:inline-block;padding:2px 6px;font-family:var(--mono);font-size:9px;

}
.fresh-tag.warn{background:rgba(255,184,77,.1);color:var(--warn)}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:18px}
.k{
  background:linear-gradient(135deg,var(--panel) 0%,var(--panel-2) 100%);

}
.k:hover::before{opacity:1}
.k small{color:var(--dim);display:block;font-size:9.5px;letter-spacing:.14em;font-weight:600;text-transform:uppercase}

.empty{padding:56px 24px;text-align:center;color:var(--dim);line-height:1.7;font-size:12.5px}
.empty .icon{font-size:32px;margin-bottom:12px;opacity:.5;display:block}
.empty b{color:var(--text);display:block;margin-bottom:6px;font-size:13px;letter-spacing:.06em}
.empty code{background:var(--panel-3);color:var(--green);padding:2px 6px;border-radius:3px;font-family:var(--mono);font-size:11px}
.empty .hint{margin-top:10px;font-size:11px;opacity:.7}

.note{
  border-left:2px solid var(--green);padding:10px 14px;
  background:rgba(157,255,87,.03);color:var(--dim);
  font-size:12px;margin-bottom:14px;border-radius:0 4px 4px 0;
}
.note.warn{border-left-color:var(--warn);background:rgba(255,184,77,.03)}
.note.danger{border-left-color:var(--danger);background:rgba(255,61,90,.03)}
.fresh{color:var(--muted);font-size:10.5px;margin-top:10px;letter-spacing:.03em}

@keyframes flash{0%{background:rgba(157,255,87,.15);box-shadow:inset 0 0 0 1px var(--green)}100%{background:transparent;box-shadow:none}}
tr.flash td{animation:flash 1.5s ease-out}

#toast{position:fixed;bottom:24px;right:24px;z-index:999;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{
  background:var(--panel-3);border:1px solid var(--border-hi);
  border-left:3px solid var(--green);padding:10px 16px;border-radius:4px;
  font-size:12.5px;color:var(--text);box-shadow:0 8px 24px rgba(0,0,0,.5);
  animation:toastIn .25s ease-out;pointer-events:auto;max-width:340px;
}
.toast.err{border-left-color:var(--danger)}

.bar.health{

}

<header>
  <div class="brand">
    <b>LAST PLAYS</b>
    <small>THE PUMP.FUN TRENCHES TERMINAL</small>
  </div>
  <nav id="nav"></nav>
  <div class="conn" id="conn"></div>

<main id="app"></main>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ROUTES=[['feed','LAST PLAYS'],['callers','BIGGEST CALLERS'],['wallets','TOP WALLETS'],['token','TOKEN INTEL'],['watchlist','WATCHLIST'],['profile','PROFILE']];
const short=a=>a?a.slice(0,4)+'…'+a.slice(-4):'—';
const n=(v,d=2)=>v==null?'n/a':Number(v).toLocaleString(undefined,{maximumFractionDigits:d});
const pct=v=>v==null?'n/a':(v>0?'+':'')+n(v,1)+'%';
const ago=t=>{const s=(Date.now()-new Date(t))/1e3;return s<60?~~s+'s ago':s<3600?~~(s/60)+'m ago':s<86400?~~(s/3600)+'h ago':~~(s/86400)+'d ago'};
const copy=t=>navigator.clipboard.writeText(t);

let sb=null,session=null,chan=null,cfg={},timer=null,lastStatus=null;

const CFGOK=()=>window.CFG&&window.CFG.supabaseUrl&&window.CFG.supabaseAnonKey;
const B58=/^[1-9A-HJ-NP-Za-km-z]{32,44}$/,PER=['24h','7d','30d'];
const ck=r=>{if(r.error)throw Object.assign(new Error(r.error.message),{status:500});return r.data};
const bad=(m,s=400)=>{throw Object.assign(new Error(m),{status:s})};

/* ─── WALLET SESSION ─── */
function setWallet(w){
  session = w ? {user:{id:w,wallet:w}} : null;
  if(w) localStorage.setItem('lp_wallet',w); else localStorage.removeItem('lp_wallet');
  route();
}
async function disconnectWallet(){
  const p=window.phantom?.solana||window.solana;
  try{ if(p?.disconnect) await p.disconnect() }catch{}
  setWallet(null);
}

/* ─── API ─── */
const api=async(p,o={})=>{if(!sb)bad('database_not_configured',503);
 const u=new URL(p,'http://x'),q=u.searchParams,path=u.pathname,m=o.method||'GET',
   now=new Date().toISOString(),lim=Math.min(Math.max(+q.get('limit')||50,1),100);
 if(path==='/status'){const rows=ck(await sb.from('ingestion_state').select('source,last_run_at,last_status,last_error'));
   return{database:true,
     pumpfun:rows.some(r=>r.source.startsWith('pumpfun')&&r.last_status==='ok'),
     helius:rows.some(r=>r.source==='helius'),ingestion:rows}}
 if(path==='/feed'){let s=sb.from('trades').select('signature,side,sol_amount,wallet,block_time,source,tokens(mint,name,symbol,market_cap_usd)').order('block_time',{ascending:false}).limit(lim);
   if(['buy','sell'].includes(q.get('side')))s=s.eq('side',q.get('side'));
   if(+q.get('minSol'))s=s.gte('sol_amount',+q.get('minSol'));
   return{events:ck(await s),fetchedAt:now}}
 if(path==='/callers'){const per=['24h','7d','30d','all'].includes(q.get('period'))?q.get('period'):'24h',
     col={avg:'avg_return_pct',best:'best_call_pct',calls:'total_calls',median:'median_return_pct'}[q.get('sort')]||'avg_return_pct';
   return{period:per,callers:ck(await sb.from('caller_performance').select('*').eq('period',per).order(col,{ascending:false,nullsFirst:false}).limit(lim)),fetchedAt:now}}
 if(path==='/wallets'){const per=PER.includes(q.get('period'))?q.get('period'):'24h',
     col={realized:'realized_pnl',combined:'combined_pnl',positions:'positions'}[q.get('sort')]||'combined_pnl';
   return{period:per,wallets:ck(await sb.from('wallet_performance').select('*').eq('period',per).order(col,{ascending:false,nullsFirst:false}).limit(lim)),fetchedAt:now}}
 if(path.startsWith('/wallet/')){const a=path.slice(8);if(!B58.test(a))bad('invalid_address');
   const[perf,trades]=await Promise.all([
     sb.from('wallet_performance').select('*').eq('wallet',a),
     sb.from('trades').select('signature,side,sol_amount,block_time,tokens(mint,symbol,name)').eq('wallet',a).order('block_time',{ascending:false}).limit(50)
   ]);
   let pf=null;
   try{const r=await fetch(window.CFG.supabaseUrl+'/functions/v1/ingest?wallet='+a,{headers:{apikey:window.CFG.supabaseAnonKey}});if(r.ok)pf=await r.json()}catch{}
   return{address:a,performance:ck(perf),trades:ck(trades),portfolio:pf,portfolioAvailable:!!pf}}
 if(path.startsWith('/token/')){const mt=path.slice(7);if(!B58.test(mt))bad('invalid_mint');
   const[t,tr,c]=await Promise.all([
     sb.from('tokens').select('*').eq('mint',mt).maybeSingle(),
     sb.from('trades').select('signature,side,sol_amount,wallet,block_time').eq('mint',mt).order('block_time',{ascending:false}).limit(50),
     sb.from('public_callouts').select('id,caller,called_at,status,max_upside_pct').eq('mint',mt).order('called_at',{ascending:false}).limit(20)
   ]);
   if(!ck(t))bad('token_not_found',404);
   const w={};ck(tr).forEach(x=>w[x.wallet]=(w[x.wallet]||0)+Number(x.sol_amount));
   return{token:t.data,trades:tr.data,callouts:ck(c),
     topWallets:Object.entries(w).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([wallet,sol_volume])=>({wallet,sol_volume}))}}
 if(path.startsWith('/watchlist')){if(!session)bad('unauthorized',401);
   if(m==='GET')return ck(await sb.from('watchlists').select('*').eq('user_id',session.user.id).order('created_at',{ascending:false}));
   if(m==='POST'){const{kind,ref}=JSON.parse(o.body);
     if(!['wallet','caller','token','callout'].includes(kind)||typeof ref!=='string'||ref.length>100)bad('invalid_input');
     ck(await sb.from('watchlists').upsert({user_id:session.user.id,kind,ref},{onConflict:'user_id,kind,ref',ignoreDuplicates:true}));
     return{ok:true}}
   if(m==='DELETE'){ck(await sb.from('watchlists').delete().eq('id',path.split('/')[2]).eq('user_id',session.user.id));return{ok:true}}}
 if(path==='/topcalls')return ck(await sb.from('public_callouts').select('id,caller,called_at,entry_market_cap_usd,max_upside_pct,hit_2x,hit_5x,hit_10x,tokens(mint,symbol,name)').neq('status','incomplete').not('max_upside_pct','is',null).order('max_upside_pct',{ascending:false}).limit(20));
 if(path==='/positions')return ck(await sb.from('largest_positions').select('*').order('net_sol',{ascending:false}).limit(lim));
 if(path==='/early')return ck(await sb.from('early_entries').select('*').order('block_time',{ascending:false}).limit(lim));
 if(path==='/active')return ck(await sb.rpc('most_active',{p_days:+q.get('days')||1}));
 if(path.startsWith('/callout/')){const id=path.slice(9);if(!/^[0-9a-f-]{36}$/i.test(id))bad('invalid_id');
   const d=await sb.from('public_callouts').select('*,tokens(*),call_snapshots(*)').eq('id',id).maybeSingle();
   if(!d.data)bad('not_found',404);return d.data}
 bad('not_found',404)};

/* ─── UI HELPERS ─── */
const empty=(m,opts={})=>`<div class="empty">
  <span class="icon">${opts.icon||'∅'}</span>
  <b>${opts.title||'NO LIVE DATA'}</b>
  <div>${m}</div>
  ${opts.hint?`<div class="hint">${opts.hint}</div>`:''}
</div>`;
const fresh=t=>`<div class="fresh">Data fetched ${t?ago(t):'—'} · source: Supabase (ingested by Edge Function)</div>`;

function toast(msg, kind=''){
  const t=document.createElement('div');
  t.className='toast '+kind;
  t.textContent=msg;
  $('#toast').appendChild(t);
  setTimeout(()=>{t.style.animation='toastIn .25s ease-out reverse';setTimeout(()=>t.remove(),250)},3000);
}

const whaleBadge=sol=>{
  const s=Number(sol)||0;
  if(s>=20)return '<span class="fresh-tag whale">🐋 WHALE</span>';
  if(s>=5)return '<span class="fresh-tag">BIG</span>';
  return '';
};
const medal=i=>{
  if(i===0)return '<span class="medal rk-1">🥇</span>';
  if(i===1)return '<span class="medal rk-2">🥈</span>';
  if(i===2)return '<span class="medal rk-3">🥉</span>';
  return `<span class="medal" style="color:var(--muted);font-size:11px;font-family:var(--mono)">${i+1}</span>`;
};
const pnlClass=v=>v==null?'':v>=0?'buy':'sell';

const warnBanner=s=>{
  if(!s)return '';
  const h=s.ingestion?.find(r=>r.source==='helius');
  if(!h)return '';
  if(h.last_status==='error')
    return `<div class="banner danger"><div><b>⚠ WEBHOOK ERROR</b><div class="msg">${esc(h.last_error||'Unknown error. Trades may be stalled.')}</div></div></div>`;
  if(h.last_run_at){
    const age=(Date.now()-new Date(h.last_run_at))/60000;
    if(age>15)return `<div class="banner"><div><b>STALE FEED</b><div class="msg">Last ingested trade was ${~~age} minutes ago. Webhook may be paused, or Pump.fun went quiet.</div></div></div>`;
  }
  return '';
};

const healthBar=ev=>{
  const buys=ev.filter(e=>e.side==='buy').length;
  const sells=ev.filter(e=>e.side==='sell').length;
  const big=ev.filter(e=>Number(e.sol_amount)>=5).length;
  const vol=ev.reduce((a,e)=>a+Number(e.sol_amount),0);
  const last=ev[0]?.block_time;
  return `<div class="bar health">
    <div class="stat"><span class="lbl">LOADED</span><span class="val">${ev.length} trades</span></div>
    <div class="stat"><span class="lbl">BUYS / SELLS</span><span class="val"><span class="buy">${buys}</span> / <span class="sell">${sells}</span></span></div>
    <div class="stat"><span class="lbl">BIG ≥5 SOL</span><span class="val">${big}</span></div>
    <div class="stat"><span class="lbl">VOLUME</span><span class="val">${n(vol,1)} SOL</span></div>
    <div class="stat"><span class="lbl">LAST TRADE</span><span class="val">${last?ago(last):'—'}</span></div>
  </div>`;
};

const portTable=p=>`<table>

async function status(){
  try{
    const s=await api('/status');
    lastStatus=s;
    const stale=t=>{
      if(!t)return 'missing';
      const m=(Date.now()-new Date(t))/60000;
      if(m<3)return 'ok';
      if(m<15)return 'stale';
      return 'old';
    };
    const h=s.ingestion.find(r=>r.source==='helius');
    const pf=s.ingestion.find(r=>r.source==='pumpfun');
    const hS=h?stale(h.last_run_at):'missing';
    const pfS=pf?stale(pf.last_run_at):'missing';
    const cls=(st,stt)=>{
      if(stt==='error')return 'bad';
      if(st==='ok')return 'ok';
      if(st==='stale')return 'warn';
      return 'bad';
    };
    const suffix=st=>st==='stale'?' ·STALE':st==='old'?' ·OLD':st==='missing'?' ·—':'';
    $('#conn').innerHTML=[
      `<span class="pill ok">DB LIVE</span>`,
      `<span class="pill ${cls(pfS,pf?.last_status)}">PUMP.FUN${suffix(pfS)}</span>`,
      `<span class="pill ${cls(hS,h?.last_status)}">HELIUS${suffix(hS)}</span>`
    ].join('');
    return s;
  }catch{
    lastStatus=null;
    $('#conn').innerHTML='<span class="pill bad">BACKEND OFFLINE</span>';
  }
}

async wallet(a){
  const d=await api('/wallet/'+a);
  let fallback=[];
  if(!d.portfolioAvailable){
    const acc={};
    for(const t of d.trades){
      const k=t.tokens?.mint; if(!k)continue;
      if(!acc[k])acc[k]={mint:k,symbol:t.tokens?.symbol??null,name:t.tokens?.name??null,bought:0,sold:0,trades:0};
      if(t.side==='buy')acc[k].bought+=Number(t.sol_amount);
      else acc[k].sold+=Number(t.sol_amount);
      acc[k].trades++;
    }
    fallback=Object.values(acc)
      .map(p=>({...p,net_sol:+(p.bought-p.sold).toFixed(6)}))
      .filter(p=>p.net_sol>0)
      .sort((a,b)=>b.net_sol-a.net_sol);
  }
  const port=d.portfolioAvailable?(d.portfolio?.data||[]):fallback;
  const label=d.portfolioAvailable
    ?'Portfolio · full history from Edge Function'
    :'Portfolio · computed locally from last 50 trades';
  $('#app').innerHTML=`

      <td>${ago(x.created_at)}</td>
      <td>${esc(x.title)}</td>
      <td>${esc(x.body||'')}</td>
    </tr>`).join('')}</table>`;
    chan=sb.channel('rt-notif').on('postgres_changes',{event:'INSERT',schema:'public',table:'notifications',filter:'user_id=eq.'+session.user.id},()=>route()).subscribe();
  }
},
async profile(){
  if(!sb){$('#app').innerHTML=`<h2>PROFILE</h2>`+empty('Supabase is not configured.',{icon:'⚙️'});return}
  if(session){
    $('#app').innerHTML=`
      <h2>PROFILE</h2>
      <p class="sub">Native Phantom session — no Supabase auth, no signature.</p>
      <div class="grid">
        <div class="k"><small>WALLET ADDRESS</small><div class="mono" style="font-size:11px;word-break:break-all">${esc(session.user.id)}</div></div>
      </div>
      <div class="bar">
        <button id="cp">COPY WALLET</button>
        <button onclick="disconnectWallet()">DISCONNECT</button>
        <a href="#watchlist"><button>OPEN WATCHLIST</button></a>
      </div>`;
    $('#cp').onclick=function(){copy(session.user.id);this.textContent='COPIED';toast('Wallet copied');setTimeout(()=>this.textContent='COPY WALLET',1200)};
  } else {
    $('#app').innerHTML=`
      <h2>PROFILE</h2>
      <div style="text-align:center;padding:60px 20px">
        <div style="font-size:64px;margin-bottom:20px;filter:drop-shadow(0 0 20px rgba(153,69,255,.4))">👻</div>
        <h2 style="justify-content:center;display:flex">CONNECT PHANTOM</h2>
        <p class="sub" style="max-width:480px;margin:10px auto 24px">Sign in with your Solana wallet — no password, no email. Follow wallets, callers, and tokens.</p>
        <button class="pri" id="go" style="padding:12px 28px;font-size:13px;letter-spacing:.1em">CONNECT WALLET →</button>
        <p class="fresh" id="er"></p>
      </div>`;
    $('#go').onclick=async()=>{
      const p=window.phantom?.solana||window.solana;
      if(!p?.isPhantom){window.open('https://phantom.app/','_blank');return}
      try{
        $('#er').textContent='Approve the connection in Phantom…';
        const resp=await p.connect();
        const wallet=resp.publicKey.toString();
        if(!B58.test(wallet))throw new Error('Invalid wallet address returned');
        setWallet(wallet);
        toast('Wallet connected');
      }catch(e){$('#er').textContent=e.message||'Connection failed'}
    };
  }
}
};

async function route(){
  cleanup();
  const [k,...r]=(location.hash.slice(1)||'feed').split('/');
  const arg=decodeURIComponent(r.join('/'));
  const nav=k==='caller'||k==='callout'?'callers':k==='wallet'?'wallets':k;
  $('#nav').innerHTML=ROUTES.map(([h,l])=>`<a href="#${h}" class="${h===nav?'on':''}">${l}</a>`).join('');
  try{await (V[k]||V.feed)(arg)}
  catch(e){
    $('#app').innerHTML=`<div class="box">${empty(e.status===503?'Database not configured on the server.':e.status===404?'Not found.':'Request failed: '+esc(e.message),{icon:'⚠️',title:'ERROR'})}</div>`;
  }
}

(async()=>{
  cfg=window.CFG||{};
  if(cfg.supabaseUrl&&cfg.supabaseAnonKey){
    sb=supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey);
    const saved=localStorage.getItem('lp_wallet');
    if(saved&&B58.test(saved))session={user:{id:saved,wallet:saved}};
  }
  status();
  setInterval(status,60000);
  addEventListener('hashchange',route);
  route();
  // Pause background work when tab is hidden (saves API calls, no Helius impact)
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden){clearInterval(timer)}
    else if(!timer){timer=setInterval(()=>{},30000)}
  });
})();
</script></body></html>
