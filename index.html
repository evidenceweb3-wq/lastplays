/* ─── SLIDE PANEL (TOKEN DETAILS) ─── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);backdrop-filter:blur(4px);z-index:100;display:none;justify-content:flex-end;}
.overlay.show{display:flex}
.slide-panel{background:var(--bg);width:100%;max-width:600px;height:100%;overflow-y:auto;border-left:1px solid var(--border);padding:24px;animation:slideIn .3s ease-out;position:relative;}
@keyframes slideIn{from{transform:translateX(100%)}to{transform:translateX(0)}}
.close-btn{position:absolute;top:20px;right:20px;background:var(--panel-2);border:1px solid var(--border);color:var(--text);width:32px;height:32px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;z-index:10;transition:all .2s;}
.close-btn:hover{background:var(--danger);color:#fff;border-color:var(--danger);}

/* ─── BULLETPROOF IMAGES ─── */
.token-avatar,.wallet-avatar{position:relative;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;flex-shrink:0;overflow:hidden;font-weight:700;color:#fff;background:var(--panel-3);vertical-align:middle;border:1px solid rgba(255,255,255,.1);box-shadow:0 2px 8px rgba(0,0,0,.4);}
.wallet-avatar{border-radius:8px}
.token-avatar .letter,.wallet-avatar .letter{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;z-index:0;pointer-events:none;text-shadow:0 1px 2px rgba(0,0,0,.5);}
.token-avatar img,.wallet-avatar img{width:100%;height:100%;object-fit:cover;display:none;position:relative;z-index:1;background:var(--panel);}
.token-cell{display:inline-flex;align-items:center;gap:12px;vertical-align:middle;}
.token-cell .name{font-size:14px;font-weight:700;color:var(--text);}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.8);backdrop-filter:blur(4px);z-index:100;display:none;align-items:center;justify-content:center}
.modal.show{display:flex}
.modal-box{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:24px;width:100%;max-width:480px}
.modal-box input{width:100%;margin-bottom:12px;padding:10px;background:var(--panel-2);border:1px solid var(--border);color:#fff;border-radius:4px;outline:none;font-family:var(--font);}
.modal-box input:focus{border-color:var(--green)}
button.pri{background:rgba(157,255,87,.1);border:1px solid var(--green);color:var(--green);padding:10px;border-radius:4px;cursor:pointer;font-weight:700;width:100%;font-family:var(--font);}
button.pri:hover{background:rgba(157,255,87,.2)}

@media(max-width:1024px){.layout{grid-template-columns:1fr}.side-col{position:static}}

<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const short=a=>a?a.slice(0,4)+'…'+a.slice(-4):'—';
const n=(v,d=2)=>v==null?'n/a':Number(v).toLocaleString(undefined,{maximumFractionDigits:d});
const ago=t=>{const s=(Date.now()-new Date(t))/1e3;return s<60?~~s+'s':s<3600?~~(s/60)+'m':s<86400?~~(s/3600)+'h':~~(s/86400)+'d'};

let sb=null,kolsCache=new Map(),allTokens=[],allTraders=[],topPlay=null;

/* ─── IMAGE PROXY ─── */
const proxyImg=(url)=>{
  if(!url)return null;
  let u=String(url).trim();
  if(u.startsWith('ipfs://'))u='https://ipfs.io/ipfs/'+u.slice(7);
  if(u.startsWith('ar://'))u='https://arweave.net/'+u.slice(5);
  return `https://wsrv.nl/?url=${encodeURIComponent(u)}&w=100&h=100&fit=cover&output=webp`;
};
const hashHue=str=>{let h=0;const s=String(str||'x');for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return Math.abs(h)%360};
const gradFor=str=>{const h=hashHue(str);return `linear-gradient(135deg,hsl(${h},55%,45%),hsl(${(h+45)%360},55%,28%))`};

const tokenAvatar=(t,size=36)=>{
  const s=size,font=Math.round(s*0.4);
  const sym=t?.symbol||t?.name||'',letter=((sym||t?.mint||'?')[0]||'?').toUpperCase();
  const bg=gradFor(t?.mint||sym);
  const url=proxyImg(t?.image_url);
  return `<div class="token-avatar" style="width:${s}px;height:${s}px">
    <span class="letter" style="font-size:${font}px;background:${bg}">${esc(letter)}</span>
    ${url?`<img src="${esc(url)}" onload="this.style.display='block'" onerror="this.style.display='none'">`:''}
  </div>`;
};

const walletAvatar=(wallet,size=32)=>{
  const s=size,font=Math.round(s*0.4);
  const kol=kolsCache.get(wallet);
  const letter=(wallet.slice(0,2)||'?').toUpperCase();
  const bg=gradFor('wallet-'+wallet);
  const url=proxyImg(kol?.avatar_url);
  return `<div class="wallet-avatar" style="width:${s}px;height:${s}px">
    <span class="letter" style="font-size:${font}px;background:${bg}">${esc(letter)}</span>
    ${url?`<img src="${esc(url)}" onload="this.style.display='block'" onerror="this.style.display='none'">`:''}
  </div>`;
};

const tokenCell=(t,size=36)=>{
  if(!t)return '—';
  const sym=t.symbol||t.name||short(t.mint);
  return `<div class="token-cell">${tokenAvatar(t,size)}<span class="name">${esc(sym)}</span></div>`;
};

async function saveKOL(){
  const name=$('#kol-name').value.trim();
  const wallet=$('#kol-wallet').value.trim();
  const avatar=$('#kol-avatar').value.trim();
  if(!name||!wallet){alert('Name and wallet required');return}
  try{
    const {error}=await sb.from('kols').upsert({wallet, name, avatar_url: avatar}, {onConflict: 'wallet'});
    if(error)throw error;
    $('#admin-modal').classList.remove('show');
    kolsCache.clear();
    init();
  }catch(e){alert('Error: '+e.message)}
}

async function loadKOLs(){
  if(kolsCache.size>0)return kolsCache;
  const {data}=await sb.from('kols').select('*');
  (data||[]).forEach(k=>kolsCache.set(k.wallet, k));
  return kolsCache;
}

async function init(){
  if(!window.CFG?.supabaseUrl){alert('Config missing');return;}
  sb=supabase.createClient(window.CFG.supabaseUrl, window.CFG.supabaseAnonKey);
  
  // Status Indicators
  $('#conn').innerHTML=`<span class="pill ok">DB LIVE</span><span class="pill ok">PUMP.FUN LIVE</span>`;

  await loadKOLs();
  
  // Fetch last 24 hours for traders, 6 hours for screener
  const cutoff24h=new Date(Date.now()-24*3600*1000).toISOString();
  const {data:trades} = await sb.from('trades')
    .select('mint,wallet,side,sol_amount,block_time,tokens(mint,symbol,name,market_cap_usd,image_url)')
    .eq('source','pumpfun')
    .gte('block_time',cutoff24h)
    .order('block_time',{ascending:false})
    .limit(3000);

  const tokens=new Map();
  const walletStats=new Map();

  const now=Date.now();

  for(const t of trades||[]){
    if(!t.mint)continue;
    const sol=Number(t.sol_amount);
    const bt=new Date(t.block_time).getTime();
    const ageHrs=(now-bt)/3600000;

    // 1. Build Token Data (Screener)
    if(!tokens.has(t.mint)){
      tokens.set(t.mint,{
        mint:t.mint, symbol:t.tokens?.symbol||t.tokens?.name||t.mint.slice(0,6),
        name:t.tokens?.name, image_url:t.tokens?.image_url, mcap:t.tokens?.market_cap_usd,
        buys:0,sells:0,buy_sol:0,sell_sol:0,vol_1h:0,kol_buys:0,
        wallets:new Set(),recent_trades:[], first_seen:bt
      });
    }
    const tk=tokens.get(t.mint);
    tk.wallets.add(t.wallet);
    if(ageHrs < 1) tk.vol_1h+=sol;
    if(bt < tk.first_seen) tk.first_seen=bt;
    
    if(t.side==='buy'){ tk.buys++; tk.buy_sol+=sol; }
    else { tk.sells++; tk.sell_sol+=sol; }
    
    tk.recent_trades.push(t);
    if(tk.recent_trades.length>50) tk.recent_trades.pop();

    if(kolsCache.has(t.wallet) && t.side==='buy') tk.kol_buys++;

    // 2. Build Wallet Stats (Best Traders & KOLs)
    if(!walletStats.has(t.wallet)){
      walletStats.set(t.wallet,{wallet:t.wallet,buys:0,sells:0,net:0,trades:0});
    }
    const ws=walletStats.get(t.wallet);
    ws.trades++;
    if(t.side==='buy') ws.buys+=sol;
    else ws.sells+=sol;
    ws.net = ws.sells - ws.buys;
  }

  // Rank Tokens
  allTokens = Array.from(tokens.values()).map(tk=>{
    const buy_ratio=tk.buys/Math.max(tk.buys+tk.sells,1);
    // EPIC SCORE ALGORITHM: Heavy weight on KOL buys, Buy Pressure, Volume, and Wallet count
    const score = Math.log10(tk.buy_sol+tk.sell_sol+1)*15 + buy_ratio*30 + Math.min(tk.wallets.size, 20) + (tk.kol_buys*150) + Math.log10(tk.vol_1h+1)*10;
    
    // FILTER DEAD TOKENS: Must have volume, mcap, and not be dumping massively
    const isDead = (tk.buy_sol+tk.sell_sol) < 1.0 || tk.mcap === 0 || tk.sell_sol > tk.buy_sol * 2;
    return {...tk, buy_ratio, score, isDead};
  }).filter(t=>!t.isDead).sort((a,b)=>b.score-a.score);

  topPlay = allTokens[0];

  // Rank Traders (Filter out small accounts, sort by Net Flow)
  allTraders = Array.from(walletStats.values())
    .filter(w=>w.trades >= 2)
    .sort((a,b)=>b.net-a.net)
    .slice(0, 10);

  render();
}

function render(){
  // 1. Render Screener Table
  if(allTokens.length===0){
    $('#screener-body').innerHTML = `<tr><td colspan="6" style="text-align:center;padding:40px;color:var(--dim)">No active Pump.fun signals right now. Waiting for volume...</td></tr>`;
  } else {
    $('#screener-body').innerHTML = allTokens.slice(0, 15).map((t,i)=>`
      <tr onclick="openToken('${t.mint}')">
        <td>${tokenCell(t, 36)}</td>
        <td class="mono">${t.mcap!=null?'$'+n(t.mcap,0):'—'}</td>
        <td class="mono">${n(t.vol_1h,1)} SOL</td>
        <td class="mono ${t.buy_ratio>0.6?'buy':t.buy_ratio<0.4?'sell':''}">${Math.round(t.buy_ratio*100)}%</td>
        <td>${t.kol_buys>0 ? `<span class="badge kol">👑 ${t.kol_buys}</span>` : '—'}</td>
        <td><span class="badge hot">${Math.round(t.score)}</span></td>
      </tr>
    `).join('');
  }

  // 2. Render Top Play Hero
  if(topPlay){
    $('#hero-container').innerHTML = `
      <div class="hero-card" onclick="openToken('${topPlay.mint}')">
        <div class="hero-head">
          ${tokenAvatar(topPlay, 64)}
          <div>
            <div style="font-size:24px;font-weight:700;">${esc(topPlay.symbol)}</div>
            <div style="font-family:var(--mono);font-size:12px;color:var(--dim);">${topPlay.mint}</div>
          </div>
        </div>
        <div class="hero-stats">
          <div class="hero-stat"><div class="lbl">Market Cap</div><div class="val">$${n(topPlay.mcap,0)}</div></div>
          <div class="hero-stat"><div class="lbl">Vol 1H</div><div class="val">${n(topPlay.vol_1h,1)} SOL</div></div>
          <div class="hero-stat"><div class="lbl">Buy Pressure</div><div class="val ${topPlay.buy_ratio>0.6?'buy':'sell'}">${Math.round(topPlay.buy_ratio*100)}%</div></div>
          <div class="hero-stat"><div class="lbl">KOL Buys</div><div class="val" style="color:var(--purple)">${topPlay.kol_buys} 👑</div></div>
        </div>
      </div>
    `;
  } else {
    $('#hero-container').innerHTML = '';
  }

  // 3. Render KOL Sidebar
  const activeKols = Array.from(kolsCache.values()).map(k => {
    const stats = allTraders.find(t=>t.wallet===k.wallet) || {net:0, trades:0};
    return {...k, ...stats};
  }).sort((a,b)=>b.net-a.net);

  if(activeKols.length===0){
    $('#kol-list').innerHTML = `<div style="color:var(--dim);font-size:12px;text-align:center;padding:20px;">No KOLs tracked yet.</div>`;
  } else {
    $('#kol-list').innerHTML = activeKols.map(k=>{
      const pnlClass = k.net >= 0 ? 'buy' : 'sell';
      return `<div class="list-item" onclick="openToken('')">
        ${walletAvatar(k.wallet, 40)}
        <div class="list-info">
          <div class="list-name">${esc(k.name)}</div>
          <div class="list-pnl ${pnlClass}">${k.net>=0?'+':''}${n(k.net,2)} SOL</div>
        </div>
      </div>`;
    }).join('');
  }

  // 4. Render Best Traders Sidebar
  if(allTraders.length===0){
    $('#trader-list').innerHTML = `<div style="color:var(--dim);font-size:12px;text-align:center;padding:20px;">Calculating smart money...</div>`;
  } else {
    $('#trader-list').innerHTML = allTraders.map(t=>{
      const pnlClass = t.net >= 0 ? 'buy' : 'sell';
      return `<div class="list-item">
        ${walletAvatar(t.wallet, 40)}
        <div class="list-info">
          <div class="list-name mono">${short(t.wallet)}</div>
          <div class="list-pnl ${pnlClass}">${t.net>=0?'+':''}${n(t.net,2)} SOL</div>
        </div>
        <div style="text-align:right">
          <div style="font-size:10px;color:var(--dim);">TRADES</div>
          <div style="font-family:var(--mono);font-size:12px;">${t.trades}</div>
        </div>
      </div>`;
    }).join('');
  }
}

// Slide Panel Logic
function openToken(mint){
  if(!mint)return;
  const t = allTokens.find(x=>x.mint===mint);
  if(!t)return;

  const buyers = new Map();
  t.recent_trades.forEach(tr=>{
    if(tr.side==='buy') buyers.set(tr.wallet, (buyers.get(tr.wallet)||0) + Number(tr.sol_amount));
  });
  const topBuyers = Array.from(buyers.entries()).sort((a,b)=>b[1]-a[1]).slice(0,5);

  $('#panel-content').innerHTML = `
    <button class="close-btn" onclick="closePanel()">×</button>
    <div style="display:flex;gap:20px;align-items:center;margin-bottom:24px;margin-top:20px;">
      ${tokenAvatar(t, 80)}
      <div>
        <h2 style="margin:0;font-size:28px;">${esc(t.symbol)}</h2>
        <div style="font-family:var(--mono);color:var(--dim);font-size:12px;">${t.mint}</div>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:24px;">
      <div style="background:var(--panel-2);padding:16px;border-radius:8px;border:1px solid var(--border);">
        <div style="font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.1em;">Market Cap</div>
        <div style="font-size:20px;font-family:var(--mono);font-weight:700;">$${n(t.mcap,0)}</div>
      </div>
      <div style="background:var(--panel-2);padding:16px;border-radius:8px;border:1px solid var(--border);">
        <div style="font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.1em;">Buy Pressure</div>
        <div style="font-size:20px;font-family:var(--mono);font-weight:700;color:${t.buy_ratio>0.5?'var(--buy)':'var(--sell)'};">${Math.round(t.buy_ratio*100)}%</div>
      </div>
    </div>

    ${t.kol_buys > 0 ? `<div style="background:rgba(153,69,255,.1);border-left:3px solid var(--purple);padding:16px;border-radius:4px;margin-bottom:24px;">
      <div style="font-weight:700;color:#d4b3ff;font-size:13px;">👑 KOL ALERT</div>
      <div style="font-size:12px;color:var(--dim);margin-top:4px;">${t.kol_buys} tracked KOL(s) are actively buying this token.</div>
    </div>` : ''}

    <h3 style="font-size:14px;letter-spacing:.1em;margin-bottom:12px;">TOP BUYERS</h3>
    <div style="background:var(--panel-2);border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:24px;">
      ${topBuyers.map(([w, amt])=>{
        const isKol = kolsCache.has(w);
        return `<div style="display:flex;justify-content:space-between;padding:12px;border-bottom:1px solid var(--border);align-items:center;">
          <div style="display:flex;align-items:center;gap:12px;">
            ${walletAvatar(w, 24)}
            <span style="font-family:var(--mono);font-size:12px;">${short(w)}</span>
            ${isKol ? `<span class="badge kol">KOL</span>` : ''}
          </div>
          <div style="font-family:var(--mono);font-size:12px;font-weight:700;color:var(--buy);">${n(amt,2)} SOL</div>
        </div>`;
      }).join('')}
    </div>

    <h3 style="font-size:14px;letter-spacing:.1em;margin-bottom:12px;">LIVE TRADES</h3>
    <div style="background:var(--panel-2);border:1px solid var(--border);border-radius:8px;overflow:hidden;">
      ${t.recent_trades.slice(0,15).map(tr=>{
        const isKol = kolsCache.has(tr.wallet);
        return `<div style="display:flex;justify-content:space-between;padding:12px;border-bottom:1px solid var(--border);align-items:center;">
          <div>
            <div style="font-family:var(--mono);font-size:12px;display:flex;align-items:center;gap:6px;">
              ${short(tr.wallet)} ${isKol ? `<span class="badge kol" style="font-size:8px;padding:1px 4px;">KOL</span>` : ''}
            </div>
            <div style="font-size:10px;color:var(--dim);margin-top:2px;">${ago(tr.block_time)} ago</div>
          </div>
          <div style="text-align:right;">
            <div class="${tr.side==='buy'?'buy':'sell'}" style="font-family:var(--mono);font-size:13px;font-weight:700;">${tr.side.toUpperCase()}</div>
            <div style="font-family:var(--mono);font-size:11px;color:var(--dim);">${n(tr.sol_amount,2)} SOL</div>
          </div>
        </div>`;
      }).join('')}
    </div>
  `;
  
  $('#token-panel').classList.add('show');
}

function closePanel(){
  $('#token-panel').classList.remove('show');
}

// Initial Load
init();
// Auto refresh every 30 seconds
setInterval(init, 30000);
</script></body></html>
