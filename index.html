<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KOL Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module">
        import { createPhantom } from 'https://cdn.jsdelivr.net/npm/@phantom/browser-injected-sdk@latest/+esm';
        import { createSolanaPlugin } from 'https://cdn.jsdelivr.net/npm/@phantom/browser-injected-sdk@latest/solana/+esm';

        // --- Configuration ---
        const SUPABASE_URL = 'YOUR_SUPABASE_PROJECT_URL';
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
        const HELIUS_API_KEY = 'fa7e6515-19de-45de-a7d1-35a64a0d9a1a';

        // --- Initialize Clients ---
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const phantom = createPhantom({ plugins: [createSolanaPlugin()] });

        // --- DOM Elements ---
        const connectBtn = document.getElementById('connect-wallet');
        const userAddressEl = document.getElementById('user-address');
        const kolListEl = document.getElementById('kol-list');

        // --- Auth Logic ---
        async function connectWallet() {
            try {
                const { address } = await phantom.solana.connect();
                console.log('Connected to Phantom:', address);
                userAddressEl.textContent = `Connected: ${address}`;

                // Here you would typically sync this with Supabase.
                // For simplicity, we're just showing the connection.
                // In a real app, you might use supabase.auth.signInWithWeb3()
                // or store the address in a user profile after an email sign-up.
                
                // Example: Save the wallet address to local storage for the session
                localStorage.setItem('walletAddress', address);
                loadKOLs(); // Load data after connecting

            } catch (error) {
                console.error('Phantom connection failed:', error);
            }
        }

        connectBtn.addEventListener('click', connectWallet);

        // --- Data Fetching Examples ---

        // Example: Fetch token data from DexScreener
        async function fetchDexScreenerData(tokenAddress) {
            const url = `https://api.dexscreener.com/latest/dex/tokens/solana/${tokenAddress}`;
            try {
                const response = await fetch(url);
                const data = await response.json();
                console.log('DexScreener Data:', data);
                // Process pairs, price, liquidity, etc. here
                return data;
            } catch (error) {
                console.error('DexScreener fetch error:', error);
            }
        }

        // Example: Fetch a wallet's transaction history from Helius
        async function fetchHeliusTxHistory(walletAddress) {
            const url = `https://api.helius.xyz/v0/addresses/${walletAddress}/transactions?api-key=${HELIUS_API_KEY}`;
            try {
                const response = await fetch(url);
                const data = await response.json();
                console.log('Helius Tx History:', data);
                // This returns parsed, human-readable transactions
                return data;
            } catch (error) {
                console.error('Helius fetch error:', error);
            }
        }

        // Example: Fetch Pump.fun data (via a third-party provider is required)
        // This is a placeholder. You would need to integrate with Bitquery, Moralis, etc.
        async function fetchPumpFunData(tokenMint) {
            console.warn('Pump.fun does not have a direct public API. Use Bitquery or Moralis.');
            // See the Bitquery GraphQL example in the notes for the kind of query you'd run.
        }

        // --- KOL Management (Supabase) ---
        async function loadKOLs() {
            const { data, error } = await supabase.from('kols').select('*, kol_wallets(*)');
            if (error) {
                console.error('Error loading KOLs:', error);
                return;
            }
            console.log('KOLs from Supabase:', data);
            // Render the KOL list in the UI
            renderKOLs(data);
        }

        function renderKOLs(kols) {
            kolListEl.innerHTML = '';
            if (!kols) return;
            kols.forEach(kol => {
                const li = document.createElement('li');
                li.textContent = `${kol.name} - Wallets: ${kol.kol_wallets.map(w => w.wallet_address).join(', ')}`;
                kolListEl.appendChild(li);
            });
        }

        // --- Initialization ---
        // Check if already connected on page load
        window.addEventListener('load', async () => {
            const savedAddress = localStorage.getItem('walletAddress');
            if (savedAddress) {
                userAddressEl.textContent = `Connected: ${savedAddress}`;
                loadKOLs();
            }
        });
    </script>
</head>
<body>
    <h1>KOL Tracker</h1>
    <button id="connect-wallet">Connect Phantom Wallet</button>
    <p id="user-address">Not connected</p>

    <h2>Tracked KOLs</h2>
    <ul id="kol-list"></ul>
</body>
</html>
