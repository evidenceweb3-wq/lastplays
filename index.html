async wallet(a){
  const d = await api('/wallet/' + a);

  // Fallback portfolio: computed from trades already loaded (never fails)
  let fallback = [];
  if (!d.portfolioAvailable) {
    const acc = {};
    for (const t of d.trades) {
      const k = t.tokens?.mint;
      if (!k) continue;
      if (!acc[k]) acc[k] = {
        mint: k,
        symbol: t.tokens?.symbol ?? null,
        name:   t.tokens?.name   ?? null,
        bought: 0, sold: 0, trades: 0,
      };
      if (t.side === 'buy') acc[k].bought += Number(t.sol_amount);
      else                  acc[k].sold   += Number(t.sol_amount);
      acc[k].trades++;
    }
    fallback = Object.values(acc)
      .map(p => ({ ...p, net_sol: +(p.bought - p.sold).toFixed(6) }))
      .filter(p => p.net_sol > 0)
      .sort((a, b) => b.net_sol - a.net_sol);
  }

  const port  = d.portfolioAvailable ? (d.portfolio?.data || []) : fallback;
  const label = d.portfolioAvailable
    ? 'Portfolio · computed from your trades (full history)'
    : 'Portfolio · computed locally from last 50 trades';

  $('#app').innerHTML = `
    <h2>WALLET ${short(a)}</h2>
    <p class="sub mono">${esc(a)} ${star('wallet', a)}</p>
    <div class="grid">
      ${['24h','7d','30d'].map(p => {
        const x = d.performance.find(r => r.period === p);
        return `<div class="k">
          <small>${p.toUpperCase()} COMBINED PNL</small>
          <div>${x ? n(x.combined_pnl) : 'n/a'}</div>
          <small>R ${x ? n(x.realized_pnl) : 'n/a'} · U ${x ? n(x.unrealized_pnl) : 'n/a'}</small>
        </div>`;
      }).join('')}
    </div>
    ${port.length
      ? `<div class="note">${label}</div><div class="box">${gen(port)}</div><br>`
      : '<div class="note">No open positions for this wallet.</div>'}
    <div class="box">
      ${d.trades.length
        ? `<table><tr><th>TIME</th><th>TOKEN</th><th>SIDE</th><th>SOL</th></tr>
           ${d.trades.map(t => `<tr>
             <td>${ago(t.block_time)}</td>
             <td>${tokLink(t.tokens)}</td>
             <td class="${t.side}">${t.side.toUpperCase()}</td>
             <td>${n(t.sol_amount)}</td>
           </tr>`).join('')}</table>`
        : empty('No trades recorded for this wallet.')}
    </div>`;
},

async token(m){
 if(!m){$('#app').innerHTML=`<h2>TOKEN INTEL</h2><p class="sub">Open any token from the feed, or paste a CA.</p><div class="bar"><input id="ca" placeholder="Token CA" style="width:420px"><button class="pri" onclick="location.hash='token/'+$('#ca').value.trim()">OPEN</button></div>`;return}
 const d=await api('/token/'+m),t=d.token;
 $('#app').innerHTML=`<h2>${esc(t.name||'Unknown')} <span class="buy">${esc(t.symbol||'')}</span></h2><p class="sub mono">${esc(t.mint)} ${caBtn(t.mint)} ${star('token',t.mint)}</p><div class="grid">${[['MARKET CAP',t.market_cap_usd],['PRICE',t.price_usd],['VOLUME 24H',t.volume_24h_usd],['LIQUIDITY',t.liquidity_usd]].map(([a,b])=>`<div class="k"><small>${a}</small><div>${b!=null?'$'+n(b,6):'n/a'}</div></div>`).join('')}</div>
 <div class="note">Community activity (social data) is not available from the connected sources. Flow below is calculated from trades ingested by LAST PLAYS: ${d.trades.filter(x=>x.side==='buy').length} buys / ${d.trades.filter(x=>x.side==='sell').length} sells in the last ${d.trades.length} trades.</div><h2>PUBLIC CALLS</h2><div class="box">${d.callouts.length?`<table><tr><th>CALLER</th><th>WHEN</th><th>STATUS</th><th>MAX UPSIDE</th></tr>${d.callouts.map(c=>`<tr><td><a class="l" href="#caller/${esc(c.caller)}">${short(c.caller)}</a></td><td><a class="l" href="#callout/${c.id}">${c.called_at?ago(c.called_at):'unverified'}</a></td><td>${c.status}</td><td>${pct(c.max_upside_pct)}</td></tr>`).join('')}</table>`:empty('No public calls recorded.')}</div>
 <h2 style="margin-top:20px">TOP ASSOCIATED WALLETS</h2><div class="box">${d.topWallets.length?`<table><tr><th>WALLET</th><th>SOL VOLUME</th></tr>${d.topWallets.map(w=>`<tr><td><a class="l" href="#wallet/${esc(w.wallet)}">${short(w.wallet)}</a></td><td>${n(w.sol_volume)}</td></tr>`).join('')}</table>`:empty('No trades recorded.')}</div>
 <h2 style="margin-top:20px">RECENT TRADES</h2><div class="box">${d.trades.length?`<table><tr><th>TIME</th><th>SIDE</th><th>SOL</th><th>WALLET</th></tr>${d.trades.map(x=>`<tr><td>${ago(x.block_time)}</td><td class="${x.side}">${x.side.toUpperCase()}</td><td>${n(x.sol_amount)}</td><td>${short(x.wallet)}</td></tr>`).join('')}</table>`:empty('No trades recorded.')}</div>`},
async callout(id){const c=await api('/callout/'+id),s=Object.fromEntries((c.call_snapshots||[]).map(x=>[x.interval_label,x]));
 $('#app').innerHTML=`<h2>CALL · ${esc(c.tokens?.symbol||short(c.mint))}</h2><p class="sub mono">caller ${esc(c.caller)} · ${c.called_at?ago(c.called_at):'unverified time'} ${star('callout',c.id)}</p>${c.status==='incomplete'?'<div class="note">INCOMPLETE: the original call time or entry price could not be verified, so no performance is shown.</div>':''}<div class="grid">${[['ENTRY MCAP',c.entry_market_cap_usd!=null?'$'+n(c.entry_market_cap_usd,0):'n/a'],['MAX UPSIDE',pct(c.max_upside_pct)],['MAX DRAWDOWN',pct(c.max_drawdown_pct)],['2X / 5X / 10X',[c.hit_2x,c.hit_5x,c.hit_10x].map(b=>b?'✔':'–').join(' ')]].map(([a,b])=>`<div class="k"><small>${a}</small><div>${b}</div></div>`).join('')}</div><div class="box"><table><tr><th>INTERVAL</th><th>MCAP</th><th>RETURN</th></tr>${['5m','15m','1h','6h','24h','7d'].map(i=>`<tr><td>${i}</td><td>${s[i]?'$'+n(s[i].market_cap_usd,0):'not captured yet'}</td><td>${s[i]?pct(s[i].return_pct):'n/a'}</td></tr>`).join('')}</table></div><p class="fresh">Token <a class="l" href="#token/${esc(c.mint)}">${short(c.mint)}</a></p>`},
async watchlist(){
 if(!session){$('#app').innerHTML=`<h2>WATCHLIST</h2>${empty('Connect Phantom in PROFILE to follow wallets, callers and tokens.')}`;return}
 const w=await api('/watchlist');$('#app').innerHTML=`<h2>WATCHLIST</h2><p class="sub">Your followed wallets, callers and tokens.</p><div class="box">${w.length?`<table><tr><th>TYPE</th><th>REF</th><th></th></tr>${w.map(x=>`<tr><td>${x.kind}</td><td><a class="l" href="#${x.kind==='callout'?'feed':x.kind}/${esc(x.ref)}">${esc(short(x.ref))}</a></td><td><button onclick="api('/watchlist/${x.id}',{method:'DELETE'}).then(()=>route())">REMOVE</button></td></tr>`).join('')}</table>`:empty('Nothing followed yet. Use ☆ anywhere.')}</div><h2 style="margin-top:20px">NOTIFICATIONS</h2><div class="box" id="nt">${empty('No notifications.')}</div>`;
 if(sb){const {data}=await sb.from('notifications').select('*').eq('user_id',session.user.id).order('created_at',{ascending:false}).limit(30);if(data?.length)$('#nt').innerHTML=`<table>${data.map(x=>`<tr><td>${ago(x.created_at)}</td><td>${esc(x.title)}</td><td>${esc(x.body||'')}</td></tr>`).join('')}</table>`;
  chan=sb.channel('rt-notif').on('postgres_changes',{event:'INSERT',schema:'public',table:'notifications',filter:'user_id=eq.'+session.user.id},()=>route()).subscribe()}},
async profile(){
 if(!sb){$('#app').innerHTML=`<h2>PROFILE</h2>${empty('Supabase is not configured: edit the 2 lines at the top of this file.')}`;return}
 if(session){
  $('#app').innerHTML=`<h2>PROFILE</h2>
   <p class="sub">Native Phantom session — no Supabase auth, no signature.</p>
   <div class="grid">
     <div class="k"><small>WALLET ADDRESS</small><div class="mono" style="font-size:11px;word-break:break-all">${esc(session.user.id)}</div></div>
   </div>
   <div class="bar">
     <button id="cp">COPY WALLET</button>
     <button onclick="disconnectWallet()">DISCONNECT</button>
     <a class="l" href="#watchlist"><button>OPEN WATCHLIST</button></a>
   </div>`;
  $('#cp').onclick = function(){ copy(session.user.id); this.textContent='COPIED'; setTimeout(()=>this.textContent='COPY WALLET',1200) };
 } else {
  $('#app').innerHTML=`<h2>PROFILE</h2>
   <p class="sub">Connect your Phantom wallet to follow wallets, callers and tokens.</p>
   <button class="pri" id="go">CONNECT PHANTOM</button>
   <p class="fresh" id="er"></p>`;
  $('#go').onclick = async () => {
    const p = window.phantom?.solana || window.solana;
    if(!p?.isPhantom){ window.open('https://phantom.app/','_blank'); return }
    try{
      $('#er').textContent = 'Approve the connection in Phantom…';
      const resp = await p.connect();
      const wallet = resp.publicKey.toString();
      if(!B58.test(wallet)) throw new Error('Invalid wallet address returned');
      setWallet(wallet);
    }catch(e){ $('#er').textContent = e.message || 'Connection failed' }
  };
 }
}
};
async function route(){cleanup();const [k,...r]=(location.hash.slice(1)||'feed').split('/'),arg=decodeURIComponent(r.join('/'));
 const nav=k==='caller'||k==='callout'?'callers':k==='wallet'?'wallets':k;$('#nav').innerHTML=ROUTES.map(([h,l])=>`<a href="#${h}" class="${h===nav?'on':''}">${l}</a>`).join('');
 try{await (V[k]||V.feed)(arg)}catch(e){$('#app').innerHTML=`<div class="box">${empty(e.status===503?'Database not configured on the server. See README.':e.status===404?'Not found.':'Request failed: '+esc(e.message))}</div>`}}
(async()=>{
 cfg=window.CFG||{};
 if(cfg.supabaseUrl&&cfg.supabaseAnonKey){
   sb=supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey);
   const saved = localStorage.getItem('lp_wallet');
   if(saved && B58.test(saved)) session = { user: { id: saved, wallet: saved } };
 }
 status();setInterval(status,60000);addEventListener('hashchange',route);route()
})();
</script></body></html>
