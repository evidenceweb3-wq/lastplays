async function getKOLs(){
  if(kolsCache.size>0)return kolsCache;
  try{
    const {data}=await sb.from('kols').select('*');
    (data||[]).forEach(k=>kolsCache.set(k.wallet, k));
  }catch{}
  return kolsCache;
}

async function getSmartWallets(){
  if(smartWalletsCache!==null)return smartWalletsCache;
  try{
    const {data}=await sb.from('wallet_performance').select('wallet,combined_pnl').gt('combined_pnl',0).order('combined_pnl',{ascending:false}).limit(100);
    smartWalletsCache=new Set((data||[]).filter(r=>!isDemo(r)).map(r=>r.wallet));
  }catch{smartWalletsCache=new Set()}
  return smartWalletsCache;
}

async function computeSignals(){
  await getKOLs();
  const smart=await getSmartWallets();
  const cutoff=new Date(Date.now()-6*3600*1000).toISOString();
  const {data:trades,error}=await sb.from('trades')
    .select('mint,wallet,side,sol_amount,block_time,tokens(mint,symbol,name,market_cap_usd,image_url)')
    .gte('block_time',cutoff).order('block_time',{ascending:false}).limit(2000);
  if(error)throw error;
  
  const now=Date.now();const tokens=new Map();
  for(const t of trades||[]){
    if(!t.mint)continue;
    const sol=Number(t.sol_amount);const bt=new Date(t.block_time).getTime();const ageSec=(now-bt)/1000;
    if(!tokens.has(t.mint)){
      tokens.set(t.mint,{mint:t.mint,symbol:t.tokens?.symbol||t.tokens?.name||t.mint.slice(0,6),
        name:t.tokens?.name,image_url:t.tokens?.image_url,mcap:t.tokens?.market_cap_usd,
        buys:0,sells:0,buy_sol:0,sell_sol:0,total_sol:0,vol_5m:0,vol_1h:0,
        wallets:new Set(),smart_buys:0,kol_buys:0,first_seen:bt,last_trade:bt});
    }
    const tk=tokens.get(t.mint);
    tk.total_sol+=sol;tk.wallets.add(t.wallet);
    if(bt<tk.first_seen)tk.first_seen=bt;
    if(bt>tk.last_trade)tk.last_trade=bt;
    if(ageSec<300)tk.vol_5m+=sol;
    if(ageSec<3600)tk.vol_1h+=sol;
    
    if(t.side==='buy'){
      tk.buys++;tk.buy_sol+=sol;
      if(smart.has(t.wallet))tk.smart_buys++;
      if(kolsCache.has(t.wallet))tk.kol_buys++;
    } else {
      tk.sells++;tk.sell_sol+=sol;
    }
  }
  
  const ranked=[...tokens.values()].map(tk=>{
    const buy_ratio=tk.buys/Math.max(tk.buys+tk.sells,1);
    const net_sol=tk.buy_sol-tk.sell_sol;
    const age_hrs=(now-tk.first_seen)/3600000;
    const fresh=age_hrs<0.5?3:age_hrs<2?2:age_hrs<6?1.5:1;
    
    // Score: KOL buys are 10x more valuable
    let score=Math.log10(tk.total_sol+1)*15 + buy_ratio*25 + Math.min(tk.wallets.size,30) + (tk.kol_buys*100) + (tk.smart_buys*50) + Math.log10(tk.vol_5m+1)*10;
    score*=fresh;
    
    // Filters: Remove dead/dumped tokens
    const isDead = tk.total_sol < 1 || tk.mcap === 0 || tk.sell_sol > tk.buy_sol * 3; // Massive dump
    
    return{...tk,buy_ratio,net_sol,age_hrs,fresh,score,wallets_count:tk.wallets.size,isDead};
  }).filter(tk=>!tk.isDead && tk.mcap != null).sort((a,b)=>b.score-a.score);
  
  return{ranked,smartCount:smart.size,totalTokens:tokens.size};
}

          <button onclick="copy('${esc(a)}');toast('Copied')">COPY</button>
          ${star('wallet',a)}
        </div>
      </div>
    </div>

    <div class="grid">
      <div class="k"><small>NET FLOW</small><div class="${pnlClass(netFlow)}">${netFlow>=0?'+':''}${n(netFlow,2)} SOL</div><small class="delta">sold − bought</small></div>
      <div class="k"><small>BOUGHT</small><div>${n(bought,2)} SOL</div></div>
      <div class="k"><small>SOLD</small><div>${n(sold,2)} SOL</div></div>
      <div class="k"><small>TRADES</small><div>${d.trades.length}</div></div>
    </div>

    ${port.length?`<div class="note">${label}</div><div class="box"><table>
      <tr><th>TOKEN</th><th>SYMBOL</th><th>NET SOL</th><th>TRADES</th></tr>
      ${port.map(x=>`<tr>
        <td><a href="#token/${esc(x.mint)}" class="token-cell" style="text-decoration:none">${tokenAvatar(x,26)}<span style="color:var(--green)">${short(x.mint)}</span></a></td>
        <td>${esc(x.symbol||x.name||'—')}</td>
        <td class="buy">${n(x.net_sol)}</td>
        <td>${x.trades||0}</td>
      </tr>`).join('')}
    </table></div><br>`:'<div class="note">No open positions.</div>'}

    <h2 style="margin-top:24px">RECENT TRADES</h2>
    <div class="box">${d.trades.length?`<table>
      <tr><th>TIME</th><th>TOKEN</th><th>SIDE</th><th>SOL</th></tr>
      ${d.trades.map(t=>`<tr>
        <td>${ago(t.block_time)} ago</td>
        <td>${tokenCell(t.tokens,24)} ${whaleBadge(t.sol_amount)}</td>
        <td class="${t.side}">${t.side.toUpperCase()}</td>
        <td>${n(t.sol_amount)}</td>
      </tr>`).join('')}
    </table>`:empty('No trades recorded.',{icon:'📭',title:'NO TRADES'})}</div>`;
},

async token(m){
  if(!m){
    $('#app').innerHTML=`<h2>TOKEN INTEL</h2>
      <p class="sub">Open any token from the feed, or paste a contract address.</p>
      <div class="bar"><input id="ca" placeholder="Token contract address" style="width:420px"><button class="pri" onclick="location.hash='token/'+$('#ca').value.trim()">OPEN</button></div>`;
    return;
  }
  const d=await api('/token/'+m),t=d.token;
  const smart=await getSmartWallets();
  const trades=d.trades;
  const now=Date.now();
  let vol_5m=0,vol_1h=0,vol_total=0,buy_sol=0,sell_sol=0,smart_buys=0;
  const buyers=new Map();
  let first_seen=null;
  for(const x of trades){
    const sol=Number(x.sol_amount);const bt=new Date(x.block_time).getTime();const age=(now-bt)/1000;
    vol_total+=sol;if(age<300)vol_5m+=sol;if(age<3600)vol_1h+=sol;
    if(x.side==='buy'){buy_sol+=sol;buyers.set(x.wallet,(buyers.get(x.wallet)||0)+1);if(smart.has(x.wallet))smart_buys++}
    else{sell_sol+=sol}
    if(!first_seen||bt<first_seen)first_seen=bt;
  }
  const buys=trades.filter(x=>x.side==='buy').length;
  const sells=trades.filter(x=>x.side==='sell').length;
  const buy_ratio=buys/Math.max(buys+sells,1);
  const age_hrs=first_seen?(now-first_seen)/3600000:0;
  const topBuyers=[...buyers.entries()].sort((a,b)=>b[1]-a[1]).slice(0,8);

  $('#app').innerHTML=`
    <div class="token-hero">
      ${tokenAvatar(t,96)}
      <div class="info">
        <h2 class="name">${esc(t.name||'Unknown')} <span class="sym">${esc(t.symbol||'')}</span></h2>
        <div class="mint-row">
          <code class="mono" style="color:var(--muted);font-size:11.5px">${esc(t.mint)}</code>
          ${caBtn(t.mint)}
          ${star('token',t.mint)}
        </div>
      </div>
    </div>

    <div class="grid">
      ${[['MARKET CAP',t.market_cap_usd],['PRICE',t.price_usd],['VOLUME 24H',t.volume_24h_usd],['LIQUIDITY',t.liquidity_usd]].map(([a,b])=>
        `<div class="k"><small>${a}</small><div>${b!=null?'$'+n(b,6):'—'}</div></div>`).join('')}
    </div>

    <h2>MOMENTUM</h2>
    <div class="bar health">
      <div class="stat"><span class="lbl">AGE</span><span class="val">${age_hrs<1?Math.round(age_hrs*60)+'m':Math.round(age_hrs)+'h'}</span></div>
      <div class="stat"><span class="lbl">VOL 5M</span><span class="val">${n(vol_5m,1)} SOL</span></div>
      <div class="stat"><span class="lbl">VOL 1H</span><span class="val">${n(vol_1h,1)} SOL</span></div>
      <div class="stat"><span class="lbl">VOL TOTAL</span><span class="val">${n(vol_total,1)} SOL</span></div>
      <div class="stat"><span class="lbl">BUY PRESSURE</span><span class="val ${buy_ratio>0.6?'buy':buy_ratio<0.4?'sell':''}">${Math.round(buy_ratio*100)}%</span></div>
      <div class="stat"><span class="lbl">NET FLOW</span><span class="val ${buy_sol-sell_sol>0?'buy':'sell'}">${(buy_sol-sell_sol>0?'+':'')+n(buy_sol-sell_sol,2)}</span></div>
    </div>

    ${smart_buys>0?`<div class="banner purple"><div><b>◆ SMART MONEY IN</b><div class="msg">${smart_buys} known profitable wallet${smart_buys>1?'s':''} bought.</div></div></div>`:''}

    <h2>TOP BUYERS</h2>
    <div class="box">${topBuyers.length?`<table>
      <tr><th>WALLET</th><th>BUYS</th><th></th></tr>
      ${topBuyers.map(([w,c])=>`<tr>
        <td>${walletCell(w,null,26)} ${smart.has(w)?'<span class="badge smart">SMART</span>':''}</td>
        <td>${c}×</td>
        <td>${star('wallet',w)}</td>
      </tr>`).join('')}
    </table>`:empty('No buyers yet.',{icon:'👛'})}</div>

    <h2 style="margin-top:24px">RECENT TRADES</h2>
    <div class="box">${trades.length?`<table>
      <tr><th>TIME</th><th>SIDE</th><th>SOL</th><th>WALLET</th></tr>
      ${trades.slice(0,25).map(x=>`<tr>
        <td>${ago(x.block_time)}</td>
        <td class="${x.side}">${x.side.toUpperCase()}</td>
        <td><b>${n(x.sol_amount)}</b> ${whaleBadge(x.sol_amount)}</td>
        <td>${walletCell(x.wallet,null,24)} ${smart.has(x.wallet)?'<span class="badge smart">S</span>':''}</td>
      </tr>`).join('')}
    </table>`:empty('No trades recorded.',{icon:'📭'})}</div>`;
},

async watchlist(){
  if(!session){
    $('#app').innerHTML=`<h2>WATCHLIST</h2>`+empty('Connect Phantom in PROFILE to follow wallets, callers and tokens.',{icon:'⭐',title:'NOT CONNECTED',hint:'Open <code>#profile</code> and connect Phantom.'});
    return;
  }
  const w=await api('/watchlist');
  $('#app').innerHTML=`
    <h2>WATCHLIST</h2>
    <p class="sub">Your followed wallets, callers, and tokens.</p>
    <div class="box">${w.length?`<table>
      <tr><th>TYPE</th><th>REF</th><th></th></tr>
      ${w.map(x=>`<tr>
        <td><span class="badge warm">${x.kind}</span></td>
        <td><a class="l" href="#${x.kind==='callout'?'feed':x.kind}/${esc(x.ref)}">${esc(short(x.ref))}</a></td>
        <td><button onclick="api('/watchlist/${x.id}',{method:'DELETE'}).then(()=>{toast('Removed');route()})">REMOVE</button></td>
      </tr>`).join('')}
    </table>`:empty('Nothing followed yet. Use ☆ anywhere.',{icon:'⭐',title:'EMPTY',hint:'Click the star next to any wallet, caller, or token.'})}</div>
    <h2 style="margin-top:28px">NOTIFICATIONS</h2>
    <div class="box" id="nt">${empty('No notifications.',{icon:'🔔',title:'QUIET'})}</div>`;
  if(sb){
    const {data}=await sb.from('notifications').select('*').eq('user_id',session.user.id).order('created_at',{ascending:false}).limit(30);
    if(data?.length)$('#nt').innerHTML=`<table>${data.map(x=>`<tr>
      <td>${ago(x.created_at)}</td><td>${esc(x.title)}</td><td>${esc(x.body||'')}</td>
    </tr>`).join('')}</table>`;
    chan=sb.channel('rt-notif').on('postgres_changes',{event:'INSERT',schema:'public',table:'notifications',filter:'user_id=eq.'+session.user.id},()=>route()).subscribe();
  }
},

async profile(){
  if(!sb){$('#app').innerHTML=`<h2>PROFILE</h2>`+empty('Supabase is not configured.',{icon:'⚙️'});return}
  if(session){
    $('#app').innerHTML=`
      <h2>PROFILE</h2>
      <p class="sub">Native Phantom session.</p>
      <div class="grid">
        <div class="k"><small>WALLET</small><div class="mono" style="font-size:12px;word-break:break-all">${esc(session.user.id)}</div></div>
      </div>
      <div class="bar">
        <button id="cp">COPY WALLET</button>
        <button onclick="disconnectWallet()">DISCONNECT</button>
        <a href="#watchlist"><button>OPEN WATCHLIST</button></a>
      </div>`;
    $('#cp').onclick=function(){copy(session.user.id);this.textContent='COPIED';toast('Wallet copied');setTimeout(()=>this.textContent='COPY WALLET',1200)};
  } else {
    $('#app').innerHTML=`
      <h2>PROFILE</h2>
      <div style="text-align:center;padding:60px 20px">
        <div style="font-size:72px;margin-bottom:24px;filter:drop-shadow(0 0 24px rgba(153,69,255,.5))">👻</div>
        <h2 style="justify-content:center;display:flex;font-size:20px">CONNECT PHANTOM</h2>
        <p class="sub" style="max-width:480px;margin:14px auto 28px">Sign in with your Solana wallet.</p>
        <button class="pri" id="go" style="padding:14px 32px;font-size:14px">CONNECT WALLET →</button>
        <p class="fresh" id="er"></p>
      </div>`;
    $('#go').onclick=async()=>{
      const p=window.phantom?.solana||window.solana;
      if(!p?.isPhantom){window.open('https://phantom.app/','_blank');return}
      try{
        $('#er').textContent='Approve in Phantom…';
        const resp=await p.connect();
        const wallet=resp.publicKey.toString();
        if(!B58.test(wallet))throw new Error('Invalid wallet');
        setWallet(wallet);toast('Wallet connected');
      }catch(e){$('#er').textContent=e.message||'Connection failed'}
    };
  }
}
};

async function route(){
  cleanup();
  const [k,...r]=(location.hash.slice(1)||'alpha').split('/');
  const arg=decodeURIComponent(r.join('/'));
  const nav=k==='caller'||k==='callout'?'callers':k==='wallet'?'kols':k;
  $('#nav').innerHTML=ROUTES.map(([h,l])=>`<a href="#${h}" class="${h===nav?'on':''} ${h==='alpha'?'alpha':''} ${h==='kols'?'kols':''}">${l}</a>`).join('');
  try{await (V[k]||V.alpha)(arg)}
  catch(e){
    $('#app').innerHTML=`<div class="box">${empty(e.status===503?'Database not configured.':e.status===404?'Not found.':'Request failed: '+esc(e.message),{icon:'⚠️',title:'ERROR'})}</div>`;
  }
}

(async()=>{
  cfg=window.CFG||{};
  if(cfg.supabaseUrl&&cfg.supabaseAnonKey){
    sb=supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey);
    const saved=localStorage.getItem('lp_wallet');
    if(saved&&B58.test(saved))session={user:{id:saved,wallet:saved}};
  }
  status();
  setInterval(status,60000);
  addEventListener('hashchange',route);
  await getKOLs();
  route();
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden){clearInterval(timer)}
    else if(!timer){timer=setInterval(()=>{},30000)}
  });
})();
</script></body></html>
